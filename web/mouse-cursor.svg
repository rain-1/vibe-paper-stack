<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Classic pixel-art mouse from Neko -->
  <!-- Body -->
  <rect x="10" y="12" width="12" height="10" fill="#000"/>
  <rect x="12" y="10" width="8" height="2" fill="#000"/>
  <rect x="12" y="22" width="8" height="2" fill="#000"/>
  <!-- Left ear -->
  <rect x="8" y="8" width="4" height="4" fill="#000"/>
  <rect x="10" y="10" width="2" height="2" fill="#fff"/>
  <!-- Right ear -->
  <rect x="20" y="8" width="4" height="4" fill="#000"/>
  <rect x="20" y="10" width="2" height="2" fill="#fff"/>
  <!-- Eyes -->
  <rect x="13" y="14" width="2" height="2" fill="#fff"/>
  <rect x="19" y="14" width="2" height="2" fill="#fff"/>
  <!-- Nose -->
  <rect x="16" y="17" width="2" height="2" fill="#fff"/>
  <!-- Whiskers -->
  <rect x="6" y="16" width="4" height="1" fill="#000"/>
  <rect x="6" y="18" width="4" height="1" fill="#000"/>
  <rect x="22" y="16" width="4" height="1" fill="#000"/>
  <rect x="22" y="18" width="4" height="1" fill="#000"/>
  <!-- Tail -->
  <rect x="22" y="20" width="2" height="2" fill="#000"/>
  <rect x="24" y="18" width="2" height="2" fill="#000"/>
  <rect x="26" y="16" width="2" height="2" fill="#000"/>
</svg>
